<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSphere - Choose Plan</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #6B7280;
            margin-bottom: 40px;
        }

        .plans {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .plan {
            background: white;
            border: 1px solid #E5E7EB;
            border-radius: 20px;
            padding: 30px;
            width: 280px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

            .plan h2 {
                margin-bottom: 10px;
            }

        .price {
            font-size: 2rem;
            font-weight: 800;
            margin: 10px 0;
        }

        .features {
            text-align: left;
            margin: 20px 0;
            color: #6B7280;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg,#2563EB,#3B82F6);
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Choose Your Plan</h1>
        <p>Select the best membership for you</p>

        <div class="plans">

            <div class="plan">
                <h2>Starter</h2>
                <div class="price">£74/mo</div>
                <div class="features">
                    ✔ Pool access<br>
                    ✔ Basic classes<br>
                </div>
                <button onclick="selectPlan('Starter', 20)">Choose</button>
            </div>

            <div class="plan">
                <h2>Pro</h2>
                <div class="price">£149/mo</div>
                <div class="features">
                    ✔ All classes<br>
                    ✔ Priority booking<br>
                </div>
                <button onclick="selectPlan('Pro', 45)">Choose</button>
            </div>

            <div class="plan">
                <h2>Elite</h2>
                <div class="price">£299/mo</div>
                <div class="features">
                    ✔ Private sessions<br>
                    ✔ VIP access<br>
                </div>
                <button onclick="selectPlan('Elite', 70)">Choose</button>
            </div>

        </div>
    </div>

    <script>
        function selectPlan(plan, price) {
            localStorage.setItem("selectedPlan", plan);
            localStorage.setItem("selectedPrice", price);

            window.location.href = "payment.html";
        }
    </script>

</body>
</html>
