<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join AquaSphere - Membership Registration</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <svg class="logo-icon" width="28" height="18" viewBox="0 0 28 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 5C5 2 8 8 11 5C14 2 17 8 20 5C23 2 26 8 26 5" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M2 11C5 8 8 14 11 11C14 8 17 14 20 11C23 8 26 14 26 11" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M2 17C5 14 8 20 11 17C14 14 17 20 20 17C23 14 26 20 26 17" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">AquaSphere</span>
      </a>
      <ul class="nav-links">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="#" class="nav-link">Locations</a></li>
      </ul>
      <div class="nav-actions">
        <button class="btn-signin" onclick="window.location.href='auth-member-login.html'">Sign In</button>
      </div>
    </div>
  </nav>

  <!-- AUTH CONTAINER -->
  <div class="auth-container auth-light auth-container-signup">
    <div class="auth-card auth-card-signup">
      <a href="/" class="auth-close-btn" title="Back to home">✕</a>

      <h1 class="auth-title">Create Free Account</h1>
      <p class="auth-subtitle">Join over 5,000 members enjoying premium swimming facilities.</p>

      <form class="auth-form auth-form-signup" id="memberSignupForm">
        <div class="form-row">
          <div class="form-group form-group-half">
            <label for="firstName" class="form-label">FIRST NAME</label>
            <div class="form-input-wrapper">
              <input type="text" id="firstName" name="firstName" placeholder="John" class="form-input" required />
            </div>
          </div>
          <div class="form-group form-group-half">
            <label for="lastName" class="form-label">LAST NAME</label>
            <div class="form-input-wrapper">
              <input type="text" id="lastName" name="lastName" placeholder="Doe" class="form-input" required />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="signupEmail" class="form-label">EMAIL ADDRESS</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 01-2.06 0L2 7"/>
            </svg>
            <input type="email" id="signupEmail" name="email" placeholder="name@example.com" class="form-input" required />
          </div>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">PHONE NUMBER</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
            </svg>
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" class="form-input" />
          </div>
        </div>

        <div class="form-group">
          <label for="signupPassword" class="form-label">PASSWORD</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" id="signupPassword" name="password" placeholder="•••••••" class="form-input" required />
          </div>
        </div>

        <div class="form-group">
          <label for="confirmSignupPassword" class="form-label">CONFIRM PASSWORD</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" id="confirmSignupPassword" name="confirmPassword" placeholder="•••••••" class="form-input" required />
          </div>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
          <label for="agreeTerms">I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a></label>
        </div>

        <button type="submit" class="auth-submit-btn auth-submit-btn-large">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14m7-7H5"/>
          </svg>
          Create My Account
        </button>
      </form>

      <p class="auth-footer-text">
        Already have an account? <a href="auth-member-login.html" class="auth-link">Sign In</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
