<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join AquaSphere - Membership Registration</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">AquaSphere</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-signin" onclick="window.location.href='auth-member-login.html'">Sign In</button>
            </div>
        </div>
    </nav>

    <div class="auth-container auth-light auth-container-signup">
        <div class="auth-card auth-card-signup">
            <a href="index.html" class="auth-close-btn" title="Back to home">✕</a>

            <h1 class="auth-title">Create Free Account</h1>

            <div id="formMessage" class="form-message"></div>

            <form class="auth-form auth-form-signup" id="memberSignupForm">
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="firstName" class="form-label">FIRST NAME</label>
                        <div class="form-input-wrapper">
                            <input type="text" id="firstName" name="firstName" class="form-input" required />
                        </div>
                    </div>

                    <div class="form-group form-group-half">
                        <label for="lastName" class="form-label">LAST NAME</label>
                        <div class="form-input-wrapper">
                            <input type="text" id="lastName" name="lastName" class="form-input" required />
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupEmail" class="form-label">EMAIL ADDRESS</label>
                    <div class="form-input-wrapper">
                        <input type="email" id="signupEmail" name="email" class="form-input" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword" class="form-label">PASSWORD</label>
                    <div class="form-input-wrapper">
                        <input type="password" id="signupPassword" name="password" class="form-input" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmSignupPassword" class="form-label">CONFIRM PASSWORD</label>
                    <div class="form-input-wrapper">
                        <input type="password" id="confirmSignupPassword" name="confirmPassword" class="form-input" required />
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn auth-submit-btn-large">
                    Create My Account
                </button>
            </form>

            <p class="auth-footer-text">
                Already have an account? <a href="auth-member-login.html" class="auth-link">Sign In</a>
            </p>
        </div>
    </div>

    <script src="auth.js?v=2"></script>
</body>
</html>
