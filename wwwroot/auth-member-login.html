<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Login - AquaSphere</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">AquaSphere</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-signin" onclick="window.location.href='auth-member-signup.html'">Sign Up</button>
            </div>
        </div>
    </nav>
    
    <div class="auth-container auth-light">
        <div class="auth-card">
            <a href="index.html" class="auth-close-btn" title="Back to home">✕</a>

            <h1 class="auth-title">Member Login</h1>
            <p class="auth-subtitle">Welcome back! Please enter your details.</p>

            <div id="formMessage" class="form-message"></div>

            <form class="auth-form" id="memberLoginForm">
                <div class="form-group">
                    <label for="memberEmail" class="form-label">EMAIL ADDRESS</label>
                    <div class="form-input-wrapper">
                        <input type="email"
                               id="memberEmail"
                               name="email"
                               class="form-input"
                               required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="memberPassword" class="form-label">PASSWORD</label>
                    <div class="form-input-wrapper">
                        <input type="password"
                               id="memberPassword"
                               name="password"
                               class="form-input"
                               required />
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn auth-submit-btn-large">
                    Sign In
                </button>
            </form>

            <p class="auth-footer-text">
                Don’t have an account? <a href="auth-member-signup.html" class="auth-link">Create one</a>
            </p>
        </div>
    </div>

    <script src="auth.js?v=2"></script>
</body>
</html>
